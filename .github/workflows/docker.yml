name: docker

on:
  push:
    paths: ["backend/**", "frontend/**", "docker-compose.yml", ".github/workflows/docker.yml"]
  pull_request:
    paths: ["backend/**", "frontend/**", "docker-compose.yml", ".github/workflows/docker.yml"]

# A newer push to the same branch or pull request replaces the running check.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build and start
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Smoke test
        run: scripts/smoke.sh
      - name: Logs
        if: failure()
        run: docker compose logs
      - run: docker compose down -v
        if: always()
