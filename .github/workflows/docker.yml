name: docker

on:
  push:
    paths: ["backend/**", "frontend/**", "docker-compose.yml", ".github/workflows/docker.yml"]
  pull_request:
    paths: ["backend/**", "frontend/**", "docker-compose.yml", ".github/workflows/docker.yml"]

jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build and start
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Smoke test
        run: |
          curl -fsS http://localhost:8080/api/health/
          curl -fsS http://localhost:8080/ | grep -q '<div id="root">'
          curl -fsSI http://localhost:8080/ | grep -qi '^content-security-policy:'
          curl -fsS http://localhost:8080/admin/login/ | grep -q 'Django'
      - name: Logs
        if: failure()
        run: docker compose logs
      - run: docker compose down -v
        if: always()
