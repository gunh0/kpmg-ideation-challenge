server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    client_max_body_size 12m; # CSV uploads are limited to 10 MB by the API

    include /etc/nginx/security-headers.conf;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API, Django admin and its static files are served by the backend.
    location ~ ^/(api|admin|static)/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite puts content hashes in asset names, so they can be cached forever.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Client-side routes (/patents, /datasets) fall back to the app.
    location / {
        try_files $uri /index.html;
    }
}
