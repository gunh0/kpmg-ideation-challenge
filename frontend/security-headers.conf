# Included by every block that sets headers: nginx drops the add_header
# directives of the enclosing block as soon as a location adds its own.
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
# Scripts and styles only from this origin; images also from Google's patent
# image host, where the representative figures live.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://patentimages.storage.googleapis.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
